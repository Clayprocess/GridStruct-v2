# 在 Windows 上构建便携 ZIP 并发布 Release；打包相关改动的 PR 只构建不发布。
# 发布入口二选一：推送 v* 标签，或在 Actions 页手动运行（按 _VERSION 新建标签）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - gridstruct-v2.spec
      - tools/build_portable.py
      - requirements.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 构建脚本和 PyInstaller 输出中文，Windows 控制台默认代码页会报编码错误。
      PYTHONUTF8: "1"
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"

      - name: 确定版本标签
        run: |
          $version = (Select-String -Path settings/dialog.py -Pattern '_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = if ($env:PUBLISH -eq "true") { "v$version" } else { "pr-${{ github.event.pull_request.number }}" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) { throw "标签 ${{ github.ref_name }} 与 settings/dialog.py 的 _VERSION=$version 不一致" }
          if ($env:PUBLISH -eq "true" -and -not (Test-Path "docs/releases/$tag.md")) { throw "缺少发布说明 docs/releases/$tag.md" }
          "TAG=$tag" >> $env:GITHUB_ENV

      - name: 构建便携包
        run: |
          python tools/build_portable.py --output dist/release
          Move-Item dist/release/GridStruct-V2-portable.zip "dist/GridStruct-V2-$env:TAG-portable.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: GridStruct-V2-portable
          path: dist/GridStruct-V2-*-portable.zip

      - name: 发布 Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # 手动运行时标签尚不存在，gh 会在当前提交上创建。
        run: gh release create $env:TAG "dist/GridStruct-V2-$env:TAG-portable.zip" --target "${{ github.sha }}" --title "GridStruct V2 $env:TAG" --notes-file "docs/releases/$env:TAG.md"
